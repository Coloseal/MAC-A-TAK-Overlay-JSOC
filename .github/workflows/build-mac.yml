name: Build Mac app

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release (mac-v<version>) with the zip attached"
        type: boolean
        default: false
  push:
    paths:
      - "mac/Sources/**"
      - "mac/Resources/**"
      - "mac/testpage/**"
      - "mac/build.sh"
      - "mac/Info.plist.template"
      - "mac/VERSION"
      - "mac/UPDATE-NOTE.txt"
      - ".github/workflows/build-mac.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (Apple Silicon)
        run: |
          sed -i '' 's/\r$//' mac/build.sh mac/VERSION mac/Info.plist.template mac/UPDATE-NOTE.txt || true
          set +e
          bash mac/build.sh > build.log 2>&1
          status=$?
          set -e
          cat build.log
          # show every compiler error as a readable annotation on the run page
          grep -E ': error:' build.log | head -n 25 | while IFS= read -r line; do
            echo "::error title=Swift compile error::$(echo "$line" | sed 's#.*/mac/##' | cut -c1-300)"
          done
          if [ "$status" -ne 0 ]; then
            echo "::error title=Build failed::exit code $status (see the log for details)"
          fi
          exit $status

      - name: Check the app file
        run: |
          APP="mac/build/Tac Map Overlay.app"
          lipo -info "$APP/Contents/MacOS/TacMapOverlay"
          codesign -dv "$APP" 2>&1 | head -n 8
          plutil -lint "$APP/Contents/Info.plist"

      - name: Self-test (drives every feature and takes pictures)
        continue-on-error: true
        run: |
          mkdir -p /tmp/tacshots /tmp/tacdata
          rm -f ~/Library/Logs/TacMapOverlay.log
          (cd mac/testpage && nohup python3 -m http.server 8765 > /tmp/http.log 2>&1 &)
          sleep 1
          TACOVERLAY_SELFTEST=/tmp/tacshots TACOVERLAY_DATA=/tmp/tacdata "mac/build/Tac Map Overlay.app/Contents/MacOS/TacMapOverlay" > /tmp/tacshots/app-out.txt 2>&1 &
          PID=$!
          for i in $(seq 1 170); do
            if grep -q '^DONE' /tmp/tacshots/selftest.txt 2>/dev/null; then break; fi
            if ! kill -0 $PID 2>/dev/null; then echo "::error title=Self-test::the app stopped before the test finished"; break; fi
            sleep 1
          done
          screencapture -x /tmp/tacshots/fullscreen.png || true
          kill $PID 2>/dev/null || true
          echo "----- self-test -----"
          cat /tmp/tacshots/selftest.txt || echo "(no self-test output)"
          echo "----- app log -----"
          cp ~/Library/Logs/TacMapOverlay.log /tmp/tacshots/app-log.txt 2>/dev/null || true
          cat /tmp/tacshots/app-log.txt 2>/dev/null || echo "(no log file)"
          grep -E '^FAIL' /tmp/tacshots/selftest.txt 2>/dev/null | head -n 25 | while IFS= read -r line; do
            echo "::error title=Self-test check failed::$(echo "$line" | cut -c1-300)"
          done
          echo "::notice title=Self-test::$(grep RESULT /tmp/tacshots/selftest.txt 2>/dev/null | cut -c1-200)"

      - name: Save the pictures on the ci-screenshots branch
        if: always()
        continue-on-error: true
        run: |
          cd /tmp/tacshots
          git init -q
          git checkout -q -b ci-screenshots
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Self-test pictures for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots

      - name: Commit the runnable app to the repository
        if: ${{ github.event_name == 'push' && success() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f mac/build
          if git diff --cached --quiet; then
            echo "No built app changes"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "Update runnable macOS app [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TacMapOverlay-mac
          path: |
            mac/build/Tac Map Overlay.app
            mac/build/*.zip
            mac/build/*.sha256
            /tmp/tacshots
            build.log
          if-no-files-found: warn

      - name: Publish release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '[:space:]' < mac/VERSION)
          ZIP="mac/build/TacMapOverlay-mac-$VERSION.zip"
          SHA=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)
          gh release create "mac-v$VERSION" "$ZIP" "$ZIP.sha256" \
            --title "Tac Map Overlay for Mac v$VERSION" \
            --notes-file mac/RELEASE-NOTES.md \
            --latest=false --prerelease --target "$GITHUB_SHA"
          # tell the apps already installed: one small text file on the main branch (this is what the update check reads)
          NOTE=$(head -n 1 mac/UPDATE-NOTE.txt)
          printf 'latest=%s\nurl=%s\nzip=%s\nsha256=%s\nnotes=%s\n' "$VERSION" \
            "https://github.com/${{ github.repository }}/releases/tag/mac-v$VERSION" \
            "https://github.com/${{ github.repository }}/releases/download/mac-v$VERSION/TacMapOverlay-mac-$VERSION.zip" \
            "$SHA" "$NOTE" > version-mac.txt
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add version-mac.txt
          git commit -m "Mac update info for v$VERSION" || true
          git push origin HEAD:main || echo "::warning title=version-mac.txt::could not update version-mac.txt on main"
